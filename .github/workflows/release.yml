name: Build and publish Windows app

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify release version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Release tag must be vMAJOR.MINOR.PATCH."
          }
          $tagVersion = $env:RELEASE_TAG.TrimStart("v")
          $fileVersion = (Get-Content app_version.txt -Raw).Trim()
          if ($tagVersion -ne $fileVersion) {
            throw "Tag version $tagVersion does not match app_version.txt ($fileVersion)."
          }
          $config = Get-Content update-config.json -Raw | ConvertFrom-Json
          if ($config.repository -ne $env:GITHUB_REPOSITORY) {
            throw "update-config.json repository must match $env:GITHUB_REPOSITORY."
          }

      - name: Install app and build dependencies
        run: |
          python -m pip install -r requirements.txt -r requirements-build.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Download offline speech model
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path build -Force | Out-Null
          $zip = Join-Path $env:RUNNER_TEMP "vosk-model-small-en-us-0.15.zip"
          Invoke-WebRequest `
            -Uri "https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip" `
            -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath build -Force

      - name: Generate branded icon
        run: python tools/create_icon.py build/delta-chest-counter.ico

      - name: Build Windows app
        shell: pwsh
        run: |
          $model = (Resolve-Path "build\vosk-model-small-en-us-0.15").Path
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --windowed `
            --name "DeltaChestCounter" `
            --icon "build\delta-chest-counter.ico" `
            --add-data "$model;vosk-model-small-en-us-0.15" `
            --hidden-import updater `
            --collect-all vosk `
            --collect-all sounddevice `
            pico_chest_counter.py

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $version = (Get-Content app_version.txt -Raw).Trim()
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            throw "Inno Setup compiler was not installed."
          }
          & $iscc "/DAppVersion=$version" "packaging\PicoChestCounter.iss"
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed to build the installer."
          }

      - name: Build legacy updater package
        shell: pwsh
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          @'
          import json
          import os
          import zipfile

          files = [
              "pico_chest_counter.py",
              "updater.py",
              "app_version.txt",
              "requirements.txt",
              "setup.bat",
              "setup.ps1",
              "run.bat",
              "share.bat",
              "share.ps1",
              "README.md",
          ]
          with zipfile.ZipFile("PicoChestCounter.zip", "w", zipfile.ZIP_DEFLATED) as archive:
              for name in files:
                  archive.write(name, name)
              archive.writestr(
                  "update-config.json",
                  json.dumps({"repository": os.environ["GITHUB_REPOSITORY"]}, indent=2) + "\n",
              )
          '@ | python -

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create "$env:GITHUB_REF_NAME" `
            "dist\installer\PicoChestCounter-Setup.exe" `
            "PicoChestCounter.zip" `
            --title "Delta Chest Counter $env:GITHUB_REF_NAME" `
            --generate-notes
